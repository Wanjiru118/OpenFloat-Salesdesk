<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SalesDesk Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">

<style>

body{
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-card{
    width:400px;
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    color:var(--navy);
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
}

.form-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.btn-login{
    width:100%;
    background:var(--teal);
    color:white;
    border:none;
    padding:14px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.btn-login:hover{
    opacity:.9;
}
#toast{
    position:fixed;
    top:20px;
    right:20px;

    background:#14B8A6;
    color:white;

    padding:15px 20px;

    border-radius:8px;

    display:none;
}

</style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        <h1>SalesDesk POS</h1>
        <p>Sign in to continue</p>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email">
    </div>

    <div class="form-group">
    <label>Password</label>

    <div style="display:flex; gap:10px;">
        <input
            type="password"
            id="password"
            style="flex:1;"
        >

        <button
            type="button"
            id="togglePassword"
            style="padding:12px;"
        >
            👁
        </button>
    </div>

</div>

    <button
    class="btn-login"
    id="loginBtn">
    Login
</button>

</div>
<div id="toast"></div>

<script src="../assets/js/auth.js"></script>
<script>

const password =
document.getElementById("password");

const togglePassword =
document.getElementById("togglePassword");

togglePassword.addEventListener("click",()=>{

    if(password.type==="password"){
        password.type="text";
    }else{
        password.type="password";
    }

});

const loginBtn =
document.getElementById("loginBtn");

const toast =
document.getElementById("toast");

function showToast(message){

    toast.innerText = message;

    toast.style.display = "block";

    setTimeout(()=>{
        toast.style.display = "none";
    },3000);

}

loginBtn.addEventListener(
    "click",
    login
);

</script>
</body>
</html>
