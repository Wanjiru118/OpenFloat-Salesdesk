<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">

</head>

<body>

    <div class="layout">

        <div id="sidebar"></div>

        <div class="main-content">

            <div id="topbar"></div>

            <div class="content">

    <!-- Dashboard Section -->
    <div id="dashboardSection">

        <div class="dashboard-cards">

            <div class="card">
                <h3>Total Sales</h3>
                <h1 id="totalSales">0</h1>
            </div>

            <div class="card">
                <h3>Total Revenue</h3>
                <h1 id="totalRevenue">0</h1>
            </div>

            <div class="card">
                <h3>Products Sold</h3>
                <h1 id="productsSold">0</h1>
            </div>

            <div class="card">
                <h3>Average Sale</h3>
                <h1 id="averageSale">0</h1>
            </div>

        </div>

        <!-- Keep your existing charts and other dashboard content here -->

    </div>


    <!-- Settings Section -->
    <div id="settingsSection" style="display: none;">

        <h2>System Settings</h2>

        <div class="card">

            <label for="businessName">
                Business Name
            </label>

            <input
                type="text"
                id="businessName"
                placeholder="Enter business name"
            >


            <label for="currency">
                Currency
            </label>

            <select id="currency">
                <option value="KES">KES - Kenyan Shilling</option>
                <option value="USD">USD - US Dollar</option>
                <option value="EUR">EUR - Euro</option>
            </select>


            <label for="taxRate">
                Tax Rate (%)
            </label>

            <input
                type="number"
                id="taxRate"
                placeholder="Enter tax rate"
                min="0"
                step="0.01"
            >


            <button id="saveSettings">
                Save Settings
            </button>

        </div>

    </div>

</div>

                <div class="chart-grid">

    <div class="card">

        <h3>Sales by Payment Method</h3>

        <canvas id="paymentChart"></canvas>

    </div>

    <div class="card">

        <h3>Top Selling Products</h3>

        <canvas id="productsChart"></canvas>

    </div>

</div>
<div class="card recent-sales">

    <h3>Recent Sales</h3>

    <div id="recentSalesList">
        No sales available.
    </div>

</div>

<div class="card top-products">

    <h3>Top Selling Products</h3>

    <div id="topProductsList">
        No sales data available.
    </div>

</div>
<div class="card payment-breakdown">

    <h3>Sales by Payment Method</h3>

    <div id="paymentBreakdown">
        No sales data available.
    </div>

</div>
<div class="card">

    <h3>Export Reports</h3>
    <div class="report-actions"></div>

    <button onclick="exportSalesReport()">
        Export Sales Report
    </button>

    <button onclick="exportInventoryReport()">
        Export Inventory Report
    </button>

</div>
            </div>

        </div>

    </div>

    <script src="../assets/js/guard.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
const savedSettings =
    JSON.parse(
        localStorage.getItem("settings")
    ) || {};

const businessName =
    savedSettings.businessName ||
    "SalesDesk";

const currency =
    savedSettings.currency ||
    "KES";

        requireAuth("admin");

        document.getElementById(
            "sidebar"
        ).innerHTML =
        createSidebar(
            "admin",
            "dashboard"
        );

     

document.getElementById(
    "topbar"
).innerHTML =
createTopbar(
    businessName + " Dashboard"
);

const sales =
    JSON.parse(
        localStorage.getItem("sales")
    ) || [];

const totalSales =
    sales.length;

let totalRevenue = 0;

let productsSold = 0;

sales.forEach(sale => {

    totalRevenue += sale.total;

    sale.items.forEach(item => {

        productsSold +=
            item.quantity;

    });

});

const averageSale =
    totalSales > 0
        ? totalRevenue / totalSales
        : 0;

document.getElementById(
    "totalSales"
).innerText =
    totalSales;

document.getElementById(
    "totalRevenue"
).innerText =
    currency + " " +
    totalRevenue.toLocaleString();

document.getElementById(
    "productsSold"
).innerText =
    productsSold;

document.getElementById(
    "averageSale"
).innerText =
    currency + " " +
    averageSale.toFixed(0);

        const recentSalesContainer =
    document.getElementById(
        "recentSalesList"
    );

if (sales.length > 0) {

    const recentSales =
        [...sales]
        .reverse()
        .slice(0, 5);

    recentSalesContainer.innerHTML = "";

    recentSales.forEach(
        sale => {

            recentSalesContainer.innerHTML += `
                <div class="sale-row">

                    <span>
                       ${sale.date.split(",")[0]}
                    </span>

                    <span>
                        ${sale.paymentMethod}
                    </span>

                    <strong>
                        KES ${sale.total}
                    </strong>

                </div>
            `;

        }
    );

}


const paymentMethods = {

    cash: 0,
    mpesa: 0,
    credit: 0

};

sales.forEach(sale => {

    const method =
        sale.paymentMethod
            .toLowerCase();

    if (
        paymentMethods[
            method
        ] !== undefined
    ) {

        paymentMethods[
            method
        ]++;

    }

});

const paymentBreakdown =
    document.getElementById(
        "paymentBreakdown"
    );

paymentBreakdown.innerHTML = `

    <div class="sale-row">
        <span>Cash</span>
        <strong>
            ${paymentMethods.cash}
            sales
        </strong>
    </div>

    <div class="sale-row">
        <span>Mpesa</span>
        <strong>
            ${paymentMethods.mpesa}
            sales
        </strong>
    </div>

    <div class="sale-row">
        <span>Credit</span>
        <strong>
            ${paymentMethods.credit}
            sales
        </strong>
    </div>

`;
new Chart(
    document.getElementById(
        "paymentChart"
    ),
    {
        type:"doughnut",

        data:{
            labels:[
                "Cash",
                "Mpesa",
                "Credit"
            ],

            datasets:[
                {
                    data:[
                        paymentMethods.cash,
                        paymentMethods.mpesa,
                        paymentMethods.credit
                    ]
                }
            ]
        }
    }
);
const productSales = {};

sales.forEach(sale => {

    sale.items.forEach(item => {

        if(
            !productSales[
                item.name
            ]
        ){
            productSales[
                item.name
            ] = 0;
        }

        productSales[
            item.name
        ] += item.quantity;

    });

});

const sortedProducts =
    Object.entries(productSales)
    .sort(
        (a, b) => b[1] - a[1]
    )
    .slice(0, 5);

const topProductsList =
    document.getElementById(
        "topProductsList"
    );

if (sortedProducts.length > 0) {

    topProductsList.innerHTML = "";

    sortedProducts.forEach(
        ([name, quantity], index) => {

            topProductsList.innerHTML += `
                <div class="sale-row">

                    <span>
                        ${index + 1}. ${name}
                    </span>

                    <strong>
                        ${quantity} sold
                    </strong>

                </div>
            `;

        }
    );

}
new Chart(
    document.getElementById(
        "productsChart"
    ),
    {
        type:"bar",

        data:{
            labels:
                Object.keys(
                    productSales
                ),

            datasets:[
                {
                    label:
                        "Units Sold",

                    data:
                        Object.values(
                            productSales
                        )
                }
            ]
        }
    }
);
function exportSalesReport() {

    const sales =
        JSON.parse(
            localStorage.getItem(
                "sales"
            )
        ) || [];

    let csv =
        "Date,Payment Method,Total\n";

    sales.forEach(sale => {

        csv +=
            `"${sale.date}",` +
            `"${sale.paymentMethod}",` +
            `"${sale.total}"\n`;

    });

    downloadCSV(
        csv,
        "sales-report.csv"
    );

}
function exportInventoryReport() {

    const products =
        JSON.parse(
            localStorage.getItem(
                "products"
            )
        ) || [];

    let csv =
        "Name,Category,Price,Stock\n";

    products.forEach(product => {

        csv +=
            `"${product.name}",` +
            `"${product.category}",` +
            `"${product.price}",` +
            `"${product.stock}"\n`;

    });

    downloadCSV(
        csv,
        "inventory-report.csv"
    );

}
function downloadCSV(
    csv,
    filename
) {

    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement(
            "a"
        );

    link.href =
        url;

    link.download =
        filename;

    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );

}
const params = new URLSearchParams(window.location.search);
const section = params.get("section");

const dashboardSection = document.getElementById("dashboardSection");
const settingsSection = document.getElementById("settingsSection");

if (section === "settings") {

    dashboardSection.style.display = "none";
    settingsSection.style.display = "block";

}

// ===============================
// SYSTEM SETTINGS
// ===============================

const businessNameInput =
    document.getElementById("businessName");

const currencyInput =
    document.getElementById("currency");

const taxRateInput =
    document.getElementById("taxRate");

const saveSettingsButton =
    document.getElementById("saveSettings");


// Load saved settings


// Put saved values into the form
if (businessNameInput) {
    businessNameInput.value =
        savedSettings.businessName || "";
}

if (currencyInput) {
    currencyInput.value =
        savedSettings.currency || "KES";
}

if (taxRateInput) {
    taxRateInput.value =
        savedSettings.taxRate || 0;
}

// Save settings
if (saveSettingsButton) {

    saveSettingsButton.addEventListener(
        "click",
        function () {

            const settings = {

                businessName:
                    businessNameInput.value.trim(),

                currency:
                    currencyInput.value,

                taxRate:
                    Number(taxRateInput.value) || 0

            };


            localStorage.setItem(
                "settings",
                JSON.stringify(settings)
            );


            alert(
                "Settings saved successfully!"
            );

        }
    );

}
    </script>

</body>

</html>
