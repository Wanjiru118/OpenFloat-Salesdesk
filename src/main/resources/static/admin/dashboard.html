<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">

</head>

<body>

    <div class="layout">

        <div id="sidebar"></div>

        <div class="main">

            <div id="topbar"></div>

            <div class="content">

                <div class="dashboard-cards">

                    <div class="card">
                        <h3>Total Products</h3>
                        <h1 id="totalProducts">0</h1>
                    </div>

                    <div class="card">
                        <h3>Inventory Value</h3>
                        <h1 id="inventoryValue">0</h1>
                    </div>

                    <div class="card">
                        <h3>Low Stock</h3>
                        <h1 id="lowStock">0</h1>
                    </div>

                    <div class="card">
                        <h3>Categories</h3>
                        <h1 id="totalCategories">0</h1>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../assets/js/guard.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>

        requireAuth("admin");

        document.getElementById(
            "sidebar"
        ).innerHTML =
        createSidebar(
            "admin",
            "dashboard"
        );

        document.getElementById(
            "topbar"
        ).innerHTML =
        createTopbar(
            "Admin Dashboard"
        );

        const products =
        JSON.parse(
            localStorage.getItem(
                "products"
            )
        ) || [];

        document.getElementById(
            "totalProducts"
        ).innerText =
        products.length;

        const inventoryValue =
        products.reduce(
            (sum, product) =>
            sum +
            (
                Number(product.price || 0)
                *
                Number(product.stock || 0)
            ),
            0
        );

        document.getElementById(
            "inventoryValue"
        ).innerText =
        "KES " +
        inventoryValue.toLocaleString();

        const lowStockProducts =
        products.filter(
            product =>
            Number(product.stock || 0) < 10
        );

        document.getElementById(
            "lowStock"
        ).innerText =
        lowStockProducts.length;

        const categories =
        new Set(
            products.map(
                product =>
                product.category
            )
        );

        document.getElementById(
            "totalCategories"
        ).innerText =
        categories.size;

    </script>

</body>

</html>
