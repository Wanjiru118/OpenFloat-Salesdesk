<!DOCTYPE html>
<html>

<head>
    <title>Activity Logs</title>

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body>

<div class="layout">

    <div id="sidebar"></div>

    <div class="main-content">

        <div id="topbar"></div>

        <div class="content">

            <h1>Activity Logs</h1>

            <div class="card activity-card">

                <table class="table">

                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Action</th>
                            <th>Details</th>
                        </tr>
                    </thead>

                    <tbody id="activityTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="../assets/js/guard.js"></script>
<script src="../assets/js/layout.js"></script>

<script>

requireAuth("admin");

document.getElementById("sidebar").innerHTML =
    createSidebar(
        "admin",
        "activity"
        );
    
    

document.getElementById("topbar").innerHTML =
    createTopbar(
        "Activity Logs"
    );
function loadActivityLogs(){

    const logs =
        JSON.parse(
            localStorage.getItem(
                "activityLogs"
            )
        ) || [];

    const table =
        document.getElementById(
            "activityTable"
        );

    table.innerHTML = "";

    if(logs.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="3">
                    No activity recorded.
                </td>
            </tr>
        `;

        return;
    }

    logs.slice().reverse().forEach(log => {

        table.innerHTML += `
            <tr>

                <td>
                    ${log.date}
                </td>

                <td>
                    ${log.action}
                </td>

                <td>
                    ${log.details}
                </td>

            </tr>
        `;

    });

}
console.log("Activity page loaded");
console.log(localStorage.getItem("activityLogs"));
console.log(document.getElementById("activityTable"));
loadActivityLogs();


</script>
</body>
</html>
