<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Stock Management</title>

<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">

</head>

<body>

<div class="layout">

    <div id="sidebar"></div>

    <div class="main-content">

        <div id="topbar"></div>

        <div class="content">

            <h1></h1>

<br>

<h1>Stock Overview</h1>

<br>

<table class="table">

    <thead>

        <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Current Stock</th>
            <th>Action</th>
        </tr>

    </thead>

    <tbody id="stockTable">

    </tbody>

</table>
        </div>
</div>
<script src="../assets/js/guard.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/api.js"></script>

<script>

requireAuth("admin");

let editIndex = null;
document.getElementById(
    "sidebar"
).innerHTML =
createSidebar(
    "admin",
    "stock"
);
document.getElementById(
    "topbar"
).innerHTML =
createTopbar(
    "Stock Management"
);


let products =
JSON.parse(
    localStorage.getItem("products")
) || [
    {
        name:"Sugar",
        category:"Groceries",
        price:150,
        stock:100
    },
    {
        name:"Bread",
        category:"Bakery",
        price:65,
        stock:40
    },
    {
        name:"Milk",
        category:"Dairy",
        price:75,
        stock:25
    }
];


function renderStock(){

    const table =
    document.getElementById(
        "stockTable"
    );

    table.innerHTML = "";

    products.forEach(
        (product,index)=>{

            table.innerHTML += `
            <tr>

                <td>${product.name}</td>

                <td>${product.category}</td>

                <td>${product.stock}</td>

                <td>

                    <button
                     onclick="addStock(${index})">
                     Add Stock
                    </button>

                </td>

            </tr>
            `;
        }
    );
}

function addStock(index){

    const quantity =
    prompt(
        "Enter quantity to add:"
    );

    if(
        !quantity ||
        Number(quantity) <= 0
    ){
        return;
    }

    products[index].stock =
    Number(
        products[index].stock
    )
    +
    Number(quantity);

    localStorage.setItem(
        "products",
        JSON.stringify(
            products
        )
    );

    renderStock();
}
renderStock();
</script>
</body>
</html>
