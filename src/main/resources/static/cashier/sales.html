<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Sales History</title>

<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">

</head>

<body>

    <div id="sidebar"></div>

    <div class="main-content">

        <div id="topbar"></div>

        <div class="content sales-content">

            <h2>Sales History</h2>
            <input
    type="text"
    id="salesSearch"
    placeholder="Search sales..."
>

            <table id="salesTable">

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>Payment</th>

                        <th>Total</th>

                        <th>Items</th>

                        <th>Details</th>
                    </tr>

                </thead>

                <tbody id="salesTableBody">

                </tbody>

            </table>
            <div
    id="saleDetailsModal"
    class="modal"
    style="display:none;"
>

    <div class="modal-content">

        <h2>Sale Details</h2>

        <div id="saleDetailsContent">

        </div>
<button id="printReceiptBtn">
    Print Receipt
</button>

<button id="closeDetailsBtn">
    Close
</button>
        

    </div>

</div>

        </div>

    </div>

    <script src="../assets/js/guard.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        

        requireAuth("cashier");

        document.getElementById("sidebar").innerHTML =
            createSidebar("cashier", "sales");

        document.getElementById("topbar").innerHTML =
            createTopbar("Sales History");

        const sales =
            JSON.parse(
                localStorage.getItem(
                    "sales"
                )
            ) || [];
        let selectedSale = null;

        function renderSales(searchTerm = "") {

            const tbody =
                document.getElementById(
                    "salesTableBody"
                );

            tbody.innerHTML = "";
            const filteredSales =
    sales.filter(
        sale => {

            const text = `
                ${sale.date}
                ${sale.paymentMethod}
                ${sale.total}
            `.toLowerCase();

            return text.includes(
                searchTerm.toLowerCase()
            );

        }
    );
    console.log("Sales:", sales);
    console.log("Filtered:", filteredSales);
    
if (filteredSales.length === 0) {

    tbody.innerHTML = `
        <tr>
            <td colspan="5">
                No sales found.
            </td>
        </tr>
    `;

    return;

}
           
        

         filteredSales.forEach(
    sale => {

        console.log("Rendering sale:", sale);
                    const itemCount =
                        sale.items.length;

                    tbody.innerHTML += `
                        <tr>

                            <td>
                                ${sale.date}
                            </td>

                            <td>
                                ${sale.paymentMethod}
                            </td>

                            <td>
                                KES ${sale.total.toLocaleString()}
                            </td>

                            <td>
    ${itemCount}
</td>

<td>
    <button
        onclick="viewSale(${sale.id})"
    >
        View
    </button>
</td>

                        </tr>
                    `;
                }
            );
  
            }
        renderSales();
        document.getElementById(
    "salesSearch"
).addEventListener(
    "input",
    function () {

        renderSales(
            this.value
        );

    }
);
   
       function viewSale(id) {

    const sale =
        sales.find(
            s => s.id === id
        );

    if (!sale) {
        return;
    }

    selectedSale = sale;
    

    let html = `
        <p> 
            <strong>Date:</strong>
            ${sale.date}
        </p>

        <p>
            <strong>Payment:</strong>
            ${sale.paymentMethod}
        </p>

        <hr>
    `;

    sale.items.forEach(
        item => {

            html += `
                <p>

                    ${item.name} 

                    x

                    ${item.quantity}

                    =

                    KES ${
                        (
                            item.price *
                            item.quantity
                        ).toLocaleString()
                    }

                </p>
            `;

        }
    );

    html += `
        <hr>

        <h3>
            Total:
            KES ${sale.total.toLocaleString()}
        </h3>
    `;

    document.getElementById(
        "saleDetailsContent"
    ).innerHTML = html;

    document.getElementById(
        "saleDetailsModal"
    ).style.display = "flex";
}
document.getElementById(
    "closeDetailsBtn"
).addEventListener(
    "click",
    function () {

        document.getElementById(
            "saleDetailsModal"
        ).style.display =
            "none";


    }
);
document.getElementById(
    "printReceiptBtn"
).addEventListener(
    "click",
    function () {

        if (!selectedSale) {
            return;
        }

        let receipt = `
SALESDESK POS
--------------------------------

Date: ${selectedSale.date}

Payment: ${selectedSale.paymentMethod}

--------------------------------
`;

        selectedSale.items.forEach(
            item => {

                receipt += `
${item.name}
x${item.quantity}
= KES ${(
    item.price *
    item.quantity
).toLocaleString()}
`;
            }
        );

        receipt += `

--------------------------------

TOTAL:
KES ${selectedSale.total.toLocaleString()}
`;

        const printWindow =
            window.open(
                "",
                "_blank"
            );

        printWindow.document.write(`
            <html>
            <head>
                <title>Receipt</title>
            </head>
            <body>
                <pre>${receipt}</pre>
            </body>
            </html>
        `);

        printWindow.document.close();

        printWindow.print();

    }
);
    </script>

</body>
</html>
